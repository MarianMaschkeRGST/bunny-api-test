{% extends "base.html" %} {% block content %}
<div>
  <h2>{{object.name}}の削除</h2>

  <p>
    {{object.name}}を削除しますか？<br />
    この操作は取り消せません。<strong>関連動画も一緒に削除されます</strong>。
  </p>

  <form method="post">
    {% csrf_token %}
    <div>
      <a href="{% url 'course_index' %}">戻る</a>
      <button type="submit">削除</button>
    </div>
  </form>
</div>
{% endblock %}
